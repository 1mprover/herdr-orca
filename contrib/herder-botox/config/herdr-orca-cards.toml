# ── herdr-orca: карточная боковая панель ─────────────────────────────────────
# Только для бинаря из этого форка (ветка orca-main). Стоковый herdr этих
# ключей не знает. Вставить в ~/.config/herdr/config.toml: `layout` — в
# существующую секцию [ui.sidebar] (или создать её), остальное — как есть.

[ui.sidebar]
layout = "cards"

[ui.sidebar.cards]
group_by = "none"
card_gap = 1
# Сколько строк сессий показывать на неактивных карточках.
inactive_rows = 3
# Остаток лимитов подписки внизу панели (тот же скрипт, что в tab_bar_right).
footer_command = "$HOME/herder-botox/bin/herdr-limits.sh"
footer_interval_seconds = 30

[ui.sidebar.cards.labels]
title = "пространства"
search = "поиск"
blocked = "ждёт"
done = "готово"
working = "работает"
idle = "простаивает"
no_repo = "без репозитория"
new = "новое"
menu = "меню"
empty = "нет пространств"
no_matches = "ничего не найдено"
now = "сейчас"
minutes = "м"
hours = "ч"
days = "д"
more = "ещё"
agents_one = "агент"
agents_few = "агента"
agents_many = "агентов"
terminals_one = "терминал"
terminals_few = "терминала"
terminals_many = "терминалов"
